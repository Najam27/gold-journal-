<!doctype html>
<html lang="en" class="dark">

  <head>
    <meta charset="UTF-8" />
    <!--
      Pinch-zoom stays enabled (no maximum-scale) because the terminal viewports
      are dense; viewport-fit=cover lets the mobile shell use the safe areas.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#070c17" />
    <meta name="description" content="Gold Journal — a private trading performance journal." />
    <link rel="manifest" href="/manifest.json" />
    <!-- The 3D bullion mark: browser tab, iOS home screen and PWA install -->
    <link rel="icon" type="image/svg+xml" href="/gold-journal-3d.svg" />
    <link rel="apple-touch-icon" href="/gold-journal-3d.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Gold Journal</title>
    <script>
      // Gold Journal is dark-only. Applying the class here (before the bundle
      // loads) guarantees the first painted frame is already the midnight
      // terminal canvas instead of flashing the base token scale.
      document.documentElement.classList.add("dark");
      document.documentElement.style.colorScheme = "dark";
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

</html>
