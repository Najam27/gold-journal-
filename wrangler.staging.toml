# Cloudflare Workers STAGING deployment (separate worker name so production on
# Netlify can keep running untouched while the Cloudflare target is verified).
#
#   pnpm build
#   pnpm dlx wrangler login
#   pnpm dlx wrangler secret put SUPABASE_SERVICE_ROLE_KEY -c wrangler.staging.toml
#   pnpm dlx wrangler deploy -c wrangler.staging.toml
#
# The staging worker gets a <name>.<subdomain>.workers.dev URL. If you build
# the frontend with VITE_AUTH_REDIRECT_URL / VITE_API_BASE_URL pointed at that
# URL, add the same origin to Supabase Auth → URL Configuration → Redirect
# URLs so email/magic-link callbacks return to the staging app.
#
# There is no AI provider secret and no AI job dispatcher on this Worker: AI
# inference runs in the user's browser against their own Groq key, so staging and
# production behave identically without any server-side AI credentials.

name = "gold-journal-staging"
main = "dist/worker/worker.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

assets = { directory = "./dist/public", not_found_handling = "none" }

[vars]
NODE_ENV = "production"
SUPABASE_STORAGE_BUCKET = "trade-screenshots"
# SUPABASE_URL = "https://<project-ref>.supabase.co"
