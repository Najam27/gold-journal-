[build]
  command = "pnpm build"
  publish = "dist/public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["server/**", "drizzle/**", "shared/**", "client/public/GoldJournal_EA.mq5"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[build.environment]
  NODE_VERSION = "22"
  # These values are public identifiers/origins, not credentials. They were
  # incorrectly marked as secret environment variables in the Netlify site,
  # causing value-based scanning to block production before deployment.
  # Keep scanning enabled for every other configured secret.
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_STORAGE_BUCKET,VITE_AUTH_REDIRECT_URL"
